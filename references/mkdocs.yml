site_name: Ros Cdk References
use_directory_urls: true
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
  palette:
    primary: deep orange
  font: false
plugins:
  - search:
      indexing: 'titles'
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
extra:
  generator: false